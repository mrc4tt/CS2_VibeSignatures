# Uploads from the internet reach this process, so it must not be able to read
# anything secret even if a parser bug gives an attacker code execution here.
# Running as root (even with no capabilities) still let it read every root-owned
# 0600 file: the gh token, /root/.ssh, other repos' .env, /etc/shadow.
[Service]
User=cs2vibe-verify
Group=cs2vibe-verify
# Hide /root, /home and /run/user behind an empty tmpfs, then show only the repo.
# The base unit says ProtectHome=read-only, which would remount the real /root over the tmpfs.
ProtectHome=no
TemporaryFileSystem=/root:ro,mode=0755 /home:ro /run/user:ro
BindReadOnlyPaths=/root/CS2_VibeSignatures
BindReadOnlyPaths=/dev/null:/root/CS2_VibeSignatures/.env
BindReadOnlyPaths=/dev/null:/root/CS2_VibeSignatures/bot/.env
InaccessiblePaths=-/root/CS2_VibeSignatures/.git
UMask=0077
PrivateUsers=true
ProtectProc=invisible
ProtectClock=true
ProtectHostname=true
ProtectKernelLogs=true
RestrictRealtime=true
RestrictSUIDSGID=true
RemoveIPC=true
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
SystemCallErrorNumber=EPERM
# The ACL grant runs as its own unit before every start. An ExecStartPre=+ step still
# ran inside this unit's mount namespace, where the repository is bind-mounted read-only,
# so setfacl failed (EROFS) the first time a pull left a .py without the grant.

[Unit]
Wants=cs2vibe-verify-acl.service
After=cs2vibe-verify-acl.service

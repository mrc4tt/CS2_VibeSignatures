  # Linux variants of the tests above: the same headers with the SDK's Linux defines.
  # run_cpp_tests reads only a class's own virtuals from clang's Itanium dump, so slots
  # inherited from a base show as missing and vtable_numvfunc comes out short; those
  # lines sit in the baseline. A slot that moves still shows as a new Index mismatch.
  - name: CEntityInstance_Linux
    symbol: CEntityInstance
    cpp: cpp_tests/centityinstance.cpp
    headers:
      - hl2sdk_cs2/public/entity2/entityinstance.h
    target: x86_64-pc-linux-gnu
    include_directories:
      - cpp_tests/stubs
      - hl2sdk_cs2/game/shared
      - hl2sdk_cs2/public
      - hl2sdk_cs2/public/tier0
      - hl2sdk_cs2/public/tier1
      - hl2sdk_cs2/public/mathlib
      - hl2sdk_cs2/common
    defines:
      - COMPILER_GCC
      - _LINUX
      - LINUX

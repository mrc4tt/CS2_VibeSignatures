# The fork's cpp_tests list (sdk_abi_check.sh). It replaces the cpp_tests: block of
# configs/<gamever>.yaml for the check, so a config upstream publishes with the old
# header layout (eiface.h, iserver.h, iloopmode.h) cannot undo the port to the
# hl2sdk fork's engine2/ headers.
cpp_tests:
  - name: CEntityInstance_MSVC
    symbol: CEntityInstance
    cpp: cpp_tests/centityinstance.cpp
    headers:
      - hl2sdk_cs2/public/entity2/entityinstance.h  # Used by the fix-cppheaders SKILL
    target: x86_64-pc-windows-msvc
    include_directories:
      - cpp_tests/stubs
      - hl2sdk_cs2/game/shared
      - hl2sdk_cs2/public
      - hl2sdk_cs2/public/tier0
      - hl2sdk_cs2/public/tier1
      - hl2sdk_cs2/public/mathlib
      - hl2sdk_cs2/common
    defines:
      - COMPILER_MSVC=1
      - COMPILER_MSVC64=1
      - _MSVC_STL_USE_ABORT_AS_DOOM_FUNCTION
      - _CRT_USE_BUILTIN_OFFSETOF
    additional_compiler_options:
      - fms-extensions
      - fms-compatibility
      - Xclang
      - fdump-vtable-layouts
    reference_modules:
      - server  # bin_artifacts/{gamever}/server/CEntityInstance_*.{platform}.yaml
      - client  # bin_artifacts/{gamever}/client/CEntityInstance_*.{platform}.yaml

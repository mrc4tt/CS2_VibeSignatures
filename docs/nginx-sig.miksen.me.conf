# nginx for sig.miksen.me - the Pages app served from a release directory.
#
# The root is a SYMLINK that the publisher flips when a build is complete
# (/srv/sig/current -> /srv/sig/releases/<stamp>), so a visitor never sees a
# half-copied site and a rollback is `ln -sfn` plus `nginx -s reload`.
#
# Install:
#   sudo install -m 644 docs/nginx-sig.miksen.me.conf /etc/nginx/sites-available/sig.miksen.me
#   sudo ln -sfn /etc/nginx/sites-available/sig.miksen.me /etc/nginx/sites-enabled/
#   sudo mkdir -p /srv/sig/releases && sudo chown -R <runner-user> /srv/sig
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: run certbot for the name, or terminate at Cloudflare and keep this on
# port 80 behind the proxy. If Cloudflare proxies the name, restore the visitor
# address from CF-Connecting-IP (see the commented real_ip block) or every log
# line and rate limit will see Cloudflare instead of the client.

server {
    listen 80;
    listen [::]:80;
    server_name sig.miksen.me;

    root /srv/sig/current;
    index index.html;

    # The symlink is the whole publishing mechanism, so nginx must follow it and
    # must not cache the resolved path across a flip.
    disable_symlinks off;
    open_file_cache off;

    access_log /var/log/nginx/sig.access.log;
    error_log  /var/log/nginx/sig.error.log;

    # Uncomment behind Cloudflare, and keep the address list current from
    # https://www.cloudflare.com/ips/ - a stale list silently trusts nobody.
    # real_ip_header CF-Connecting-IP;
    # set_real_ip_from 173.245.48.0/20;
    # ...

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite emits content-addressed asset names, and the gamedata and gamesymbol
    # payloads are named by their own SHA-256, so a changed file is a changed
    # URL. Those can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~ ^/(gamedata|gamesymbols)/(payloads|metadata|snapshots)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The indexes, the datasets and latest.json are NOT content-addressed: they
    # are the entry points that tell the app which content-addressed files to
    # fetch. Caching these is how a browser ends up asking for assets that the
    # current release no longer has.
    location ~ ^/(gamedata/index\.json|gamesymbols/index\.json|latest\.json|.*\.metadata\.json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Client-side routing: an unknown path is a route, not a missing file.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Nothing here should be reachable as a directory listing.
    autoindex off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}

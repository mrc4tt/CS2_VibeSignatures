# Public gamedata checker API for sig.miksen.me (CS2_VibeSignatures verify_service.py on
# 127.0.0.1:8787, unit cs2vibe-verify.service). Cloudflare-proxied like img.miksen.me: ufw
# opens 443 to Cloudflare's ranges only, so every request here came through Cloudflare and
# CF-Connecting-IP is the visitor's address, not something a client could set itself.
# sig.miksen.me is served from GitHub Pages, so the API is cross-origin and CORS is
# allowed for that one origin only.

# limit_req skips an empty key, so a request without the header is limited by its socket peer.
map $http_cf_connecting_ip $sigapi_client {
    default  $http_cf_connecting_ip;
    ""       $remote_addr;
}
limit_req_zone $sigapi_client zone=sigapi_scan:10m rate=6r/m;
limit_req_zone $sigapi_client zone=sigapi_read:10m rate=60r/m;
limit_req_zone $sigapi_client zone=sigapi_store:10m rate=2r/m;
limit_conn_zone $sigapi_client zone=sigapi_conn:10m;

map $http_origin $sigapi_cors {
    default                  "";
    "https://sig.miksen.me"  $http_origin;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sig-api.miksen.me;

    ssl_certificate     /etc/letsencrypt/live/miksen-public/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miksen-public/privkey.pem;

    # The service refuses anything bigger too; this stops it before it is read.
    client_max_body_size 256k;
    client_body_timeout 10s;
    limit_conn sigapi_conn 4;
    limit_req_status 429;
    limit_conn_status 429;

    error_page 404 /404.html;
    location = /404.html {
        root /var/www/server-ops;
        internal;
    }

    # Scans cost a worker for seconds: a short burst, then 6 a minute per visitor.
    location ~ ^/api/(verify|check)$ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $sigapi_cors always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary Origin always;
            return 204;
        }
        # Not limit_except: it moves other methods into an inner context the
        # OPTIONS return above never runs in, and the preflight got a 403.
        if ($request_method != POST) {
            return 405;
        }
        limit_req zone=sigapi_scan burst=4 nodelay;
        add_header Access-Control-Allow-Origin $sigapi_cors always;
        add_header Vary Origin always;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $sigapi_client;
        proxy_read_timeout 90s;
    }

    location ~ ^/api/(builds|health)$ {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        limit_req zone=sigapi_read burst=20 nodelay;
        add_header Access-Control-Allow-Origin $sigapi_cors always;
        add_header Vary Origin always;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $sigapi_client;
        proxy_read_timeout 10s;
    }

    # Stored user files (user_files.py). Storing one is rare: 2 a minute, burst 3.
    location = /api/files {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $sigapi_cors always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary Origin always;
            return 204;
        }
        if ($request_method != POST) {
            return 405;
        }
        limit_req zone=sigapi_store burst=3 nodelay;
        add_header Access-Control-Allow-Origin $sigapi_cors always;
        add_header Vary Origin always;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $sigapi_client;
        proxy_read_timeout 20s;
    }

    # The manage token travels in a header, never in the URL, so it is in no access log.
    location = /api/files/manage {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $sigapi_cors always;
            add_header Access-Control-Allow-Methods "GET, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, X-Manage-Token" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary Origin always;
            return 204;
        }
        if ($request_method !~ ^(GET|PUT|DELETE)$) {
            return 405;
        }
        limit_req zone=sigapi_read burst=10 nodelay;
        add_header Access-Control-Allow-Origin $sigapi_cors always;
        add_header Vary Origin always;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $sigapi_client;
        proxy_read_timeout 20s;
    }

    # The read link a game server fetches: /api/files/<22-char id>/<filename>.
    location ~ "^/api/files/[A-Za-z0-9_-]{22}(/[A-Za-z0-9._-]{1,100})?$" {
        if ($request_method != GET) {
            return 405;
        }
        limit_req zone=sigapi_read burst=20 nodelay;
        add_header Access-Control-Allow-Origin $sigapi_cors always;
        add_header Vary Origin always;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $sigapi_client;
        proxy_read_timeout 10s;
    }

    location / {
        return 404;
    }
}

[project]
name = "cs2-vibesignatures"
version = "0.1.0"
description = "CS2 signature and offset generation utilities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "httpx",
    "ida-pro-mcp",
    "mcp",
    "openai",
    "python-dotenv",
    "pyyaml",
    "redis",
    "requests",
    "ruamel.yaml>=0.19.1",
    "uvicorn>=0.41.0",
    "vdf",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "yamlfix>=1.19.1",
]

[tool.uv]
package = false

[tool.uv.sources]
ida-pro-mcp = { git = "https://github.com/mrexodia/ida-pro-mcp.git", rev = "2f762bbbd26764cb855e693051a5426650fa5acf" }

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["hl2sdk_cs2"]

[tool.yamlfix]
explicit_start = false
line_length = 120
preserve_quotes = true
sequence_style = "keep_style"

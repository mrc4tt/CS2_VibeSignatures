# Identity of function records that no automatic evidence covers.
# Read by audit_identity_evidence.py. Key: `Symbol` (both platforms) or `Symbol.platform`.
#
# confirmed: someone proved in the binary that the record is the function it is named
#            after, and the value says how. Not "the signature matches" - that is placement.
#            Once confirmed, the relocation gates (drift, slot, twin) carry it forward.
# unproven:  records an enabled plugin ships that have NO identity evidence yet. Known
#            debt, listed so the gate can refuse every NEW one. Each works on live
#            servers, which is why it was never questioned - and is not proof. To clear
#            one: verify it on that platform (rule 12), move it to confirmed with the
#            evidence, or give its finder an anchor so it needs no entry at all.
#            Never add to this list to make a gate pass: a new shipped record is verified.

